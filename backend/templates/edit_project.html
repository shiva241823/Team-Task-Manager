<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>Admin Panel</h2>

        <a href="/admin">Dashboard</a>

        <a href="/create-project">Create Project</a>

        <a href="/view-projects">View Projects</a>

        <a href="/create-task">Create Task</a>

        <a href="/create-member">Manage Members</a>

        <a href="/member-progress">
            View Tasks
        </a>

        <a href="/logout">Logout</a>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main-content">

        <!-- NAVBAR -->

        <div class="navbar">

            <h2>Edit Project</h2>

            <div>
                <a href="/logout">Logout</a>
            </div>

        </div>


        <!-- PAGE TITLE -->

        <div style="margin-top:30px;">

            <h1>Update Project</h1>

            <p style="margin-top:10px; color:gray;">
                Edit project details and update information.
            </p>

        </div>


        <!-- FORM -->

        <div style="margin-top:40px;">

            <div class="form-container">

                <form method="POST">

                    <!-- TITLE -->

                    <div class="form-group">

                        <label>Project Title</label>

                        <input
                            type="text"
                            name="title"
                            value="{{ project.title }}"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label>Project Description</label>

                        <textarea
                            name="description"
                            required
                        >{{ project.description }}</textarea>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Project
                    </button>

                    <a
                        href="/view-projects"
                        class="btn btn-warning"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
