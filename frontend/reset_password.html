<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Reset Password</h2>

            <p style="
                text-align:center;
                margin-bottom:25px;
                color:gray;
            ">

                Enter reset code sent to

                <br><br>

                <strong>
                    {{ user.email }}
                </strong>

            </p>

            <form method="POST">

                <div class="form-group">

                    <label>
                        Reset Code
                    </label>

                    <input
                        type="text"
                        name="token"
                        placeholder="Enter reset code"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                    style="width:100%;"
                >

                    Reset Password

                </button>

            </form>

            <div style="
                text-align:center;
                margin-top:20px;
            ">

                <a href="/login">

                    Back to Login

                </a>

            </div>

        </div>

    </div>

</body>

</html>
