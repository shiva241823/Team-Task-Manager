<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | Team Task Manager
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- =========================
                 TITLE
            ========================== -->

            <h2>
                Team Task Manager
            </h2>

            <p style="
                text-align:center;
                margin-bottom:25px;
                color:gray;
            ">

                Login to manage projects,
                tasks and team progress.

            </p>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form method="POST">

                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%;"
                >

                    Login

                </button>

            </form>


            <!-- =========================
                 FORGOT PASSWORD
            ========================== -->

            <div style="
                margin-top:18px;
                text-align:center;
            ">

                <a href="/forgot-password">

                    Forgot Password?

                </a>

            </div>


            <!-- =========================
                 REGISTER
            ========================== -->

            <div style="
                margin-top:25px;
                text-align:center;
            ">

                <p>

                    Don't have an account?

                </p>

                <a
                    href="/register"
                    class="btn btn-success"
                    style="
                        margin-top:12px;
                        width:100%;
                    "
                >

                    Create Account

                </a>

            </div>

        </div>

    </div>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
