<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register | Team Task Manager
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- =========================
                 TITLE
            ========================== -->

            <h2>
                Create Account
            </h2>

            <p style="
                text-align:center;
                margin-bottom:25px;
                color:gray;
            ">

                Register to manage projects,
                tasks and team collaboration.

            </p>


            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <form method="POST">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Create username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <!-- AGE -->

                <div class="form-group">

                    <label>
                        Age
                    </label>

                    <input
                        type="number"
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%;"
                >

                    Register Account

                </button>

            </form>


            <!-- =========================
                 LOGIN LINK
            ========================== -->

            <div style="
                margin-top:25px;
                text-align:center;
            ">

                <p>

                    Already have an account?

                </p>

                <a
                    href="/login"
                    class="btn btn-success"
                    style="
                        margin-top:12px;
                        width:100%;
                    "
                >

                    Login

                </a>

            </div>

        </div>

    </div>

</body>

</html>
