<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>Email Verification</h2>

            <p style="
                text-align:center;
                margin-bottom:25px;
                color:gray;
            ">

                Verification code sent to

                <br><br>

                <strong>
                    {{ user.email }}
                </strong>

            </p>

            <form method="POST">

                <div class="form-group">

                    <label>
                        Enter Verification Code
                    </label>

                    <input
                        type="text"
                        name="code"
                        placeholder="Enter 6 digit code"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%;"
                >

                    Verify Account

                </button>

            </form>

            <div style="
                text-align:center;
                margin-top:20px;
            ">

                <a href="/login">

                    Back to Login

                </a>

            </div>

        </div>

    </div>

</body>

</html>
