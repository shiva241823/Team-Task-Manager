<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Task</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <h2>Admin Panel</h2>

        <a href="/admin">Dashboard</a>

        <a href="/create-project">Create Project</a>

        <a href="/view-projects">View Projects</a>

        <a href="/create-task">Create Task</a>

        <a href="/create-member">Manage Members</a>

        <a href="/member-progress">
            View Tasks
        </a>

        <a href="/logout">Logout</a>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="main-content">

        <!-- NAVBAR -->

        <div class="navbar">

            <h2>Create Task</h2>

            <div>
                <a href="/logout">Logout</a>
            </div>

        </div>


        <!-- PAGE TITLE -->

        <div style="margin-top:30px;">

            <h1>Create & Assign Task</h1>

            <p style="margin-top:10px; color:gray;">
                Create a task and assign it to multiple team members.
            </p>

        </div>


        <!-- FORM -->

        <div style="margin-top:40px;">

            <div class="form-container">

                <form method="POST">

                    <!-- TASK TITLE -->

                    <div class="form-group">

                        <label>Task Title</label>

                        <input
                            type="text"
                            name="title"
                            placeholder="Enter task title"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label>Task Description</label>

                        <textarea
                            name="description"
                            placeholder="Enter task description"
                            required
                        ></textarea>

                    </div>


                    <!-- PROJECT -->

                    <div class="form-group">

                        <label>Select Project</label>

                        <select
                            name="project_id"
                            required
                        >

                            <option value="">
                                -- Select Project --
                            </option>

                            {% for project in projects %}

                            <option value="{{ project.id }}">
                                {{ project.title }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- MULTIPLE MEMBER ASSIGNMENT -->

                    <div class="form-group">

                        <label>
                            Assign Members
                        </label>

                        <select
                            name="assigned_to"
                            multiple
                            required
                            style="height:220px;"
                        >

                            {% for member in members %}

                            <option value="{{ member.id }}">

                                {{ member.full_name }}
                                ({{ member.username }})

                            </option>

                            {% endfor %}

                        </select>

                        <small style="
                            color:gray;
                            display:block;
                            margin-top:8px;
                        ">
                            Hold CTRL (Windows) or CMD (Mac)
                            to select multiple members.
                        </small>

                    </div>


                    <!-- DUE DATE -->

                    <div class="form-group">

                        <label>Due Date</label>

                        <input
                            type="date"
                            name="due_date"
                            required
                        >

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Task
                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
